<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/9kgPx8bH/AllGroup.jpg">
    <!--  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/0e140a534a.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.0/min/vs/loader.min.js"></script>
    <title>CodeForge — AI-Powered Live Coding”</title>

</head>

<body>
    <div id="frontend">
        <canvas id="backgroundCanvas"></canvas>
        <div class="overlay"></div>

        <div class="container">
            <div class="hero-content">
                <h1 id="headline"></h1>
                <p class="subtitle" id="subtitle"></p>
                <button class="cta-button" id="ctaButton" onclick="buttonLive()">Live Coding</button>
            </div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="container-fluid">
        <div class="row">
            <div class="left col-12 col-md-6" id="left-hide">
                <div class="bos d-flex flex-row">
                    <button class="btn btn-primary teeku" id="tim" onclick="dark()"><i class="fa-solid fa-sun"></i></button>
                    <button class="btn  btn-success beeku" onclick="save()"><i class="fa-solid fa-floppy-disk"></i></button>
                    <button class="btn btn-info beeku" onclick="file()"><i class="fa-solid fa-folder-open"></i></button>
                    <button class="btn btn-warning beeku" onclick="home()"><i class="fa-solid fa-house"></i></button>
                    <button class="btn btn-primary meeku d-md-none" onclick="hide()"><i class="fa-solid fa-person-running nar"></i></button>
                </div>
                <div class="generate-container m-3">
                    <input id="aiPrompt" class="form-control" placeholder="Describe the website..." />
                    <button onclick="generateCode()" class="btn btn-success">Submit</button>
                </div>
                <label><i class="fa-brands fa-html5"></i>HTML</label>
                <div id="htmlCode" class="htmleditor editor w-100" style=" height: 200px;"></div>
                <label><i class="fa-brands fa-css3-alt"></i>CSS</label>
                <div id="CssCode" class="csseditor editor w-100" style="height: 200px;"></div>
                <label><i class="fa-brands fa-js"></i>JS</label>
                <div id="JsCode" class="jseditor editor w-100" style="height: 200px;"></div>

            </div>
            <div class="col-12  col-md-8 m-auto my" id="my">
                <div class="box shadow  ">
                    <p class="para para1">Name your Code Snippet</p>
                    <input type="text" class="form-control totoo p-3" id="totoo" placeholder="First name" aria-label="First name">
                    <p class="para mt-2" id="para">Only give file name without extension</p>
                    <div class="but d-flex flex-row text-center">
                        <button class="btn btn-danger ml-3 mr-4 timtim" onclick="back()">Cancel</button>
                        <button class="btn btn-success timtim" id="but" onclick="saveFile()">SAVE</button>
                    </div>
                </div>
            </div>
            <div class="files col-12" id="files-container">
                <div class="prime2 mt-4" id="prime2">
                    <button class="btn btn-primary" id="sectionLog2" onclick="show2()"><i class="fa-solid fa-code"></i></button>
                </div>
                <div id="files-list">

                </div>
            </div>
            <div class="right col-12 col-md-6 d-md-block" id="right-show">
                <label id="outputpara"><i class="fa-solid fa-play"></i>Output</label>
                <iframe id="output" class="w-100"></iframe>

                <div class="prime d-md-none mt-4" id="prime">
                    <button class="btn btn-primary" id="sectionLog" onclick="show()"><i class="fa-solid fa-code"></i></button>
                </div>
                <!-- <div class="prime prime4" id="prime">
                    <button class="btn btn-primary" id="sectionLog" onclick="generate()"><i class="fa-solid fa-brain"></i></button>
                </div> -->
            </div>
        </div>
        <!-- <div id="ai-status" class="mt-2 text-muted"></div> -->
    </div>

</body>

</html>
